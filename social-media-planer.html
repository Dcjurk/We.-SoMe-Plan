  window.kvGet = async (key) => {

function getMonday(d){const dt=new Date(d),day=dt.getDay(),diff=dt.getDate()-day+(day===0?-6:1);return new Date(dt.setDate(diff));}
function getWeekDays(mon){return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;});}
function fmtISO(d){return d.toISOString().split("T")[0];}
function fmtDE(s){return new Date(s+"T12:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});}
function getMonthDays(year,month){
  const first=new Date(year,month,1),offset=(first.getDay()+6)%7,dim=new Date(year,month+1,0).getDate(),cells=[];
  for(let i=0;i<offset;i++)cells.push(null);
  for(let d=1;d<=dim;d++)cells.push(new Date(year,month,d));
  while(cells.length%7!==0)cells.push(null);
  return cells;
}

function Badge({label,colors}){
  return <span style={{display:"inline-block",padding:"2px 8px",borderRadius:99,fontSize:10,fontWeight:600,
    background:colors.bg,color:colors.text,border:`1px solid ${colors.border}`,whiteSpace:"nowrap"}}>{label}</span>;
}

const inp={width:"100%",padding:"9px 12px",border:`1px solid ${C.plumMid}`,borderRadius:8,

function PersonSelector({team,value,onChange}){
  const [open,setOpen]=useState(false);
  const ref=useRef();
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[]);
  const toggle=name=>onChange(value.includes(name)?value.filter(x=>x!==name):[...value,name]);
  const label=value.length===0?"Niemand ausgewählt":value.length===1?value[0]:`${value.length} Personen`;
  return(
    <div ref={ref} style={{position:"relative"}}>
      <div onClick={()=>setOpen(o=>!o)} style={{...inp,cursor:"pointer",display:"flex",justifyContent:"space-between",
        alignItems:"center",userSelect:"none",background:open?C.white:C.naturalWhite}}>
        <span style={{color:value.length?C.charcoal:C.plum4}}>{label}</span>
        <span style={{color:C.plum3,fontSize:11}}>{open?"▲":"▼"}</span>
      </div>
      {open&&(
        <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:C.white,
          border:`1px solid ${C.plumMid}`,borderRadius:8,zIndex:200,boxShadow:"0 8px 24px rgba(128,2,57,0.15)",overflow:"hidden"}}>
          {team.map(name=>{
            const sel=value.includes(name);
            return(
              <div key={name} onClick={()=>toggle(name)}
                style={{padding:"9px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,
                  background:sel?C.plumLight:C.white,borderBottom:`1px solid ${C.plumLight}`}}>
                <div style={{width:16,height:16,borderRadius:4,border:`2px solid ${sel?C.lightPlum:C.plumMid}`,
                  background:sel?C.lightPlum:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  {sel&&<span style={{color:C.white,fontSize:10,lineHeight:1}}>✓</span>}
                </div>
                <span style={{fontSize:13,color:C.charcoal,fontWeight:sel?600:400}}>👤 {name}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PostCard({post,onClick,onDragStart,compact}){
  const [hov,setHov]=useState(false);
  const cb=CARD_BG[post.statusPost]||CARD_BG["Geplant"];
  const persons=Array.isArray(post.persons)?post.persons:(post.person?[post.person]:[]);
  return(
    <div draggable onDragStart={e=>{e.dataTransfer.effectAllowed="move";onDragStart(post.id);}}
      onClick={()=>onClick(post)} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{background:cb.bg,border:`1px solid ${cb.border}`,borderLeft:`4px solid ${PLbar[post.platform]||C.plum2}`,
        borderRadius:8,padding:compact?"7px 9px":"10px 12px",cursor:"grab",marginBottom:5,opacity:cb.opacity,
        boxShadow:hov?"0 4px 16px rgba(128,2,57,0.13)":"0 1px 3px rgba(128,2,57,0.06)",
        transition:"box-shadow 0.15s",userSelect:"none"}}>
      <div style={{fontWeight:700,fontSize:compact?11:13,color:C.charcoal,marginBottom:4,lineHeight:1.3}}>{post.topic}</div>
      {!compact&&<div style={{marginBottom:4}}><Badge label={post.platform} colors={PL[post.platform]||PL["Beide"]}/></div>}
      <div style={{fontSize:10,color:C.plum3,marginBottom:compact?0:5}}>
        {persons.length?persons.map(p=>`👤 ${p}`).join("  "):"—"}
      </div>
      {!compact&&(
        <div style={{display:"flex",flexDirection:"column",gap:3,marginTop:5}}>
          {[["Post",SP,post.statusPost],["Copy",SC,post.statusCopy],["Visual",SV,post.statusVisual]].map(([l,map,val])=>(
            <div key={l} style={{display:"flex",alignItems:"center",gap:4}}>
              <span style={{fontSize:10,color:C.plum4,width:36,flexShrink:0}}>{l}</span>
              <Badge label={val} colors={map[val]||Object.values(map)[0]}/>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function DayCell({day,posts,onClick,onDragStart,onDrop,compact,isToday,addPost}){
  const [over,setOver]=useState(false);
  return(
    <div onDragOver={e=>{e.preventDefault();setOver(true);}} onDragLeave={()=>setOver(false)}

      </div>
      {posts.map(p=><PostCard key={p.id} post={p} onClick={onClick} onDragStart={onDragStart} compact={compact}/>)}
      <button onClick={()=>addPost(fmtISO(day))} style={{width:"100%",padding:"4px",background:"transparent",
        border:`1px dashed ${C.plumMid}`,borderRadius:6,color:C.plum4,fontSize:11,cursor:"pointer",marginTop:2,fontFamily:"inherit"}}>
        + Post

function TeamModal({team,onSave,onClose}){
  const [members,setMembers]=useState([...team]);
  const [newName,setNewName]=useState("");
  const add=()=>{const n=newName.trim();if(!n||members.includes(n))return;setMembers(m=>[...m,n]);setNewName("");};
  const remove=name=>{if(members.length<=1)return;setMembers(m=>m.filter(x=>x!==name));};
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(128,2,57,0.35)",
      display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(3px)"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.naturalWhite,borderRadius:16,padding:"28px 30px",
        width:400,maxWidth:"94vw",boxShadow:"0 24px 60px rgba(128,2,57,0.2)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <h2 style={{margin:0,fontSize:17,fontWeight:800,color:C.deepPlum}}>👥 Team verwalten</h2>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:C.plum4,lineHeight:1}}>✕</button>
        </div>
        <div style={{marginBottom:16}}>
          {members.map(m=>(
            <div key={m} style={{display:"flex",alignItems:"center",justifyContent:"space-between",
              padding:"9px 12px",background:C.white,border:`1px solid ${C.plumMid}`,borderRadius:8,marginBottom:6}}>
              <span style={{fontSize:14,color:C.charcoal,fontWeight:500}}>👤 {m}</span>
              <button onClick={()=>remove(m)} disabled={members.length<=1}
                style={{background:C.yellowLight,border:`1px solid ${C.yellow}`,color:"#9a6c00",
                  borderRadius:6,padding:"3px 10px",fontSize:12,fontWeight:600,
                  cursor:members.length<=1?"not-allowed":"pointer",opacity:members.length<=1?0.4:1,fontFamily:"inherit"}}>
                Entfernen
              </button>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:8,marginBottom:22}}>
          <input value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}

          <button onClick={add} style={{padding:"9px 16px",background:C.aqua,color:C.white,border:"none",
            borderRadius:8,fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
            + Hinzufügen
          </button>
        </div>
        <button onClick={()=>onSave(members)} style={{width:"100%",padding:"10px",background:C.aqua,
          color:C.white,border:"none",borderRadius:8,fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>
          Speichern
        </button>
      </div>
    </div>
  );
}

function Modal({post,onSave,onDelete,onClose,team}){
  const isNew=!post.id;
  const initPersons=Array.isArray(post.persons)?post.persons:(post.person?[post.person]:[team[0]]);
  const [f,setF]=useState({
    id:post.id||null,topic:post.topic||"",date:post.date||fmtISO(new Date()),
    platform:post.platform||"LinkedIn",persons:initPersons,
    statusPost:post.statusPost||"Geplant",statusCopy:post.statusCopy||"In Arbeit",statusVisual:post.statusVisual||"Gebrieft",
  });
  const [confirmDel,setConfirmDel]=useState(false);
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(128,2,57,0.35)",
      display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(3px)"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.naturalWhite,borderRadius:16,padding:"28px 30px",
        width:450,maxWidth:"94vw",boxShadow:"0 24px 60px rgba(128,2,57,0.2)",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
          <h2 style={{margin:0,fontSize:17,fontWeight:800,color:C.deepPlum}}>
            {isNew?"➕ Neuer Post":"✏️ Post bearbeiten"}
          </h2>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:C.plum4,lineHeight:1}}>✕</button>
        </div>
        <div style={{marginBottom:14}}>
          <label style={lbl}>Thema *</label>
          <input value={f.topic} onChange={e=>s("topic",e.target.value)} placeholder="z. B. Case Study Launch" style={inp}/>
        </div>
        <div style={{marginBottom:14}}>
          <label style={lbl}>Datum</label>
          <input type="date" value={f.date} onChange={e=>s("date",e.target.value)} style={inp}/>
        </div>
        <div style={{marginBottom:14}}>
          <label style={lbl}>Plattform</label>
          <select value={f.platform} onChange={e=>s("platform",e.target.value)} style={inp}>
            {PLATFORMS.map(o=><option key={o}>{o}</option>)}
          </select>
        </div>
        <div style={{marginBottom:14}}>
          <label style={lbl}>Verantwortlich</label>

        {[

          {lbl:"Status Copy",  k:"statusCopy",  opts:STATUS_COPY},
          {lbl:"Status Visual",k:"statusVisual",opts:STATUS_VISUAL},
        ].map(({lbl:l,k,opts})=>(
          <div key={k} style={{marginBottom:14}}>
            <label style={lbl}>{l}</label>
            <select value={f[k]} onChange={e=>s(k,e.target.value)} style={inp}>
              {opts.map(o=><option key={o}>{o}</option>)}

          </div>
        ))}
        <div style={{display:"flex",gap:10,marginTop:22}}>
          <button onClick={()=>{
            if(!f.topic.trim()||f.persons.length===0)return;
            onSave({...f,id:f.id||Date.now().toString()});
          }} style={{flex:1,padding:"10px",background:C.aqua,color:C.white,border:"none",
            borderRadius:8,fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>
            Speichern

          {!isNew&&!confirmDel&&(
            <button onClick={()=>setConfirmDel(true)} style={{padding:"10px 16px",background:C.yellowLight,
              color:"#9a6c00",border:`1px solid ${C.yellow}`,borderRadius:8,fontWeight:600,fontSize:14,
              cursor:"pointer",fontFamily:"inherit"}}>Löschen</button>
          )}
          {!isNew&&confirmDel&&(

    </div>

}

          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <select value={fPerson} onChange={e=>setFPerson(e.target.value)}
              style={{padding:"6px 10px",border:`1px solid ${C.plum2}`,borderRadius:8,fontSize:12,
                color:C.white,background:C.plum1,fontFamily:"inherit",outline:"none",cursor:"pointer"}}>
              <option>Alle</option>
              {team.map(t=><option key={t}>{t}</option>)}
            </select>
            <select value={fPlat} onChange={e=>setFPlat(e.target.value)}
              style={{padding:"6px 10px",border:`1px solid ${C.plum2}`,borderRadius:8,fontSize:12,
                color:C.white,background:C.plum1,fontFamily:"inherit",outline:"none",cursor:"pointer"}}>
              <option>Alle</option>
              {PLATFORMS.map(p=><option key={p}>{p}</option>)}
            </select>
            <button onClick={()=>setTeamModal(true)} title="Team verwalten"
              style={{...navBtn,background:C.plum1,border:`1px solid ${C.plum2}`,color:C.white,fontSize:15,padding:"6px 11px"}}>👥</button>
            <div style={{display:"flex",background:C.plum1,borderRadius:8,padding:3,gap:2}}>
              {[["week","Woche"],["month","Monat"],["list","Liste"]].map(([v,l])=>(
                <button key={v} onClick={()=>setView(v)} style={{padding:"5px 11px",borderRadius:6,border:"none",
                  cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:view===v?700:500,
                  background:view===v?C.white:"transparent",
                  color:view===v?C.deepPlum:C.yellow,
                  boxShadow:view===v?"0 1px 3px rgba(0,0,0,0.12)":"none",transition:"all 0.15s"}}>{l}</button>
              ))}
            </div>
            <button onClick={()=>setModal({})} style={{background:C.aqua,color:C.white,border:"none",
              borderRadius:8,padding:"7px 16px",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",
              boxShadow:"0 2px 8px rgba(22,125,131,0.35)"}}>
              + Neuer Post
            </button>
          </div>
        </div>
      </div>

      <div style={{padding:"20px",maxWidth:1500,margin:"0 auto"}}>

        {view==="week"&&(
          <>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18,flexWrap:"wrap"}}>
              <button onClick={()=>{const d=new Date(mon);d.setDate(d.getDate()-7);setMon(d);}} style={navBtn}>← Vorherige</button>
              <span style={{fontWeight:700,fontSize:14,color:C.deepPlum,minWidth:220,textAlign:"center"}}>{weekLabel()}</span>
              <button onClick={()=>{const d=new Date(mon);d.setDate(d.getDate()+7);setMon(d);}} style={navBtn}>Nächste →</button>
              <button onClick={()=>setMon(getMonday(new Date()))}
                style={{...navBtn,color:C.aquaDark,borderColor:C.aqua,background:C.aquaLight}}>Heute</button>
              <span style={{marginLeft:"auto",fontSize:12,color:C.plum4}}>{filtered.length} Posts</span>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:10}}>
              {weekDays.map((day,i)=>(
                <DayCell key={i} day={day} isToday={fmtISO(day)===todayStr}
                  posts={filtered.filter(p=>p.date===fmtISO(day))}
                  onClick={setModal} onDragStart={id=>{dragId.current=id;}}
                  onDrop={handleDrop} compact={false} addPost={ds=>setModal({date:ds})}/>
              ))}
            </div>
          </>
        )}

        {view==="month"&&(
          <>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18,flexWrap:"wrap"}}>
              <button onClick={()=>{const d=new Date(monthDate);d.setMonth(d.getMonth()-1);setMonthDate(d);}} style={navBtn}>← Vorheriger</button>
              <span style={{fontWeight:700,fontSize:14,color:C.deepPlum,minWidth:180,textAlign:"center"}}>
                {MONTHS_DE[monthDate.getMonth()]} {monthDate.getFullYear()}
              </span>
              <button onClick={()=>{const d=new Date(monthDate);d.setMonth(d.getMonth()+1);setMonthDate(d);}} style={navBtn}>Nächster →</button>
              <button onClick={()=>setMonthDate(new Date())}
                style={{...navBtn,color:C.aquaDark,borderColor:C.aqua,background:C.aquaLight}}>Heute</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6,marginBottom:6}}>
              {DAYS_SHORT.map(d=>(
                <div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:C.plum3,
                  textTransform:"uppercase",letterSpacing:"0.05em",padding:"4px 0"}}>{d}</div>
              ))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6}}>
              {monthCells.map((day,i)=>day?(
                <DayCell key={i} day={day} isToday={fmtISO(day)===todayStr}
                  posts={filtered.filter(p=>p.date===fmtISO(day))}
                  onClick={setModal} onDragStart={id=>{dragId.current=id;}}
                  onDrop={handleDrop} compact={true} addPost={ds=>setModal({date:ds})}/>
              ):(
                <div key={i} style={{minHeight:80,borderRadius:12}}/>
              ))}
            </div>
          </>
        )}

        {view==="list"&&(
          <div style={{background:C.white,borderRadius:12,border:`1px solid #e8d8e0`,overflow:"auto",
            boxShadow:"0 2px 12px rgba(128,2,57,0.07)"}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:820}}>
              <thead>
                <tr style={{background:C.deepPlum,borderBottom:`2px solid ${C.lightPlum}`}}>
                  {["Datum","Thema","Plattform","Verantwortlich","Status Post","Status Copy","Status Visual",""].map(h=>(
                    <th key={h} style={{padding:"12px 15px",textAlign:"left",fontSize:11,fontWeight:700,
                      color:C.plum5,textTransform:"uppercase",letterSpacing:"0.05em",whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {[...filtered].sort((a,b)=>a.date.localeCompare(b.date)).map((post,i)=>{
                  const cb=CARD_BG[post.statusPost]||CARD_BG["Geplant"];
                  const rowBg=post.statusPost==="Eingestellt"?C.yellowLight:post.statusPost==="Gepostet"?C.aquaLight:post.statusPost==="Reportet"?"#f5f0f0":i%2===0?C.white:C.naturalWhite;
                  const persons=Array.isArray(post.persons)?post.persons:(post.person?[post.person]:[]);
                  return(
                    <tr key={post.id} style={{borderBottom:`1px solid #f0e4ea`,background:rowBg,opacity:cb.opacity}}>
                      <td style={td}><span style={{fontWeight:600,color:C.plum2,fontSize:13,whiteSpace:"nowrap"}}>{fmtDE(post.date)}</span></td>
                      <td style={td}><span style={{fontWeight:600,color:C.charcoal,fontSize:14}}>{post.topic}</span></td>
                      <td style={td}><Badge label={post.platform} colors={PL[post.platform]||PL["Beide"]}/></td>
                      <td style={td}><span style={{fontSize:12,color:C.charcoal,whiteSpace:"nowrap"}}>{persons.map(p=>`👤 ${p}`).join(", ")}</span></td>
                      <td style={td}><Badge label={post.statusPost} colors={SP[post.statusPost]||SP["Geplant"]}/></td>
                      <td style={td}><Badge label={post.statusCopy} colors={SC[post.statusCopy]||SC["In Arbeit"]}/></td>
                      <td style={td}><Badge label={post.statusVisual} colors={SV[post.statusVisual]||SV["Gebrieft"]}/></td>
                      <td style={td}>
                        <button onClick={()=>setModal(post)} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,padding:"2px 6px"}}>✏️</button>
                      </td>
                    </tr>
                  );
                })}
                {filtered.length===0&&(
                  <tr><td colSpan={8} style={{padding:48,textAlign:"center",color:C.plum4,fontSize:14}}>
                    Noch keine Posts vorhanden – erstelle deinen ersten! 🚀
                  </td></tr>
                )}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {teamModal&&<TeamModal team={team} onSave={m=>{saveTeam(m);setTeamModal(false);}} onClose={()=>setTeamModal(false)}/>}
      {modal!==null&&<Modal post={modal} onSave={handleSave} onDelete={handleDelete} onClose={()=>setModal(null)} team={team}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
