// ── Helpers ───────────────────────────────────────────────────
function getMonday(d){const dt=new Date(d),day=dt.getDay(),diff=dt.getDate()-day+(day===0?-6:1);return new Date(dt.setDate(diff));}
function getWeekDays(mon){return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;});}
function fmtISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function fmtDE(s){return new Date(s+"T12:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});}
function getMonthDays(year,month){
  const first=new Date(year,month,1),offset=(first.getDay()+6)%7,dim=new Date(year,month+1,0).getDate(),cells=[];
  for(let i=0;i<offset;i++)cells.push(null);
  for(let d=1;d<=dim;d++)cells.push(new Date(year,month,d));
  while(cells.length%7!==0)cells.push(null);
  return cells;
}
// ── NEW: chunk month cells into week rows of 7 ───────────────
function chunkWeeks(arr){
  const weeks=[];for(let i=0;i<arr.length;i+=7)weeks.push(arr.slice(i,i+7));return weeks;
}
// ── NEW: compute which grid columns an event occupies in a given week row ──
function getEventBars(events, weekCells) {
  const isos = weekCells.map(d => d ? fmtISO(d) : null);
  const valid = isos.filter(Boolean);
  if (!valid.length) return [];
  const wStart = valid[0], wEnd = valid[valid.length-1];
  return events.filter(e => e.dateEnd >= wStart && e.dateStart <= wEnd).map(e => {
    let cs = isos.findIndex(d => d && d >= e.dateStart);
    if (cs === -1) cs = isos.findIndex(d => d !== null);
    let ce = -1;
    for (let i=6;i>=0;i--){if(isos[i]&&isos[i]<=e.dateEnd){ce=i;break;}}
    if (cs===-1||ce===-1) return null;
    return { event:e, colStart:cs+1, colEnd:ce+2 };
  }).filter(Boolean);
}

// ── NEW: ChipInput – free-text tag field for external persons ─
function ChipInput({value, onChange}) {
  const [input,setInput]=useState("");
  const add=()=>{const v=input.trim();if(!v)return;if(!value.includes(v))onChange([...value,v]);setInput("");};
  const remove=name=>onChange(value.filter(x=>x!==name));
  return(
    <div style={{border:`1px solid ${C.plumMid}`,borderRadius:8,padding:"6px 10px",
      background:C.naturalWhite,display:"flex",flexWrap:"wrap",gap:5,alignItems:"center",minHeight:44}}>
      {value.map(name=>(
        <span key={name} style={{display:"inline-flex",alignItems:"center",gap:4,background:C.yellowLight,
          border:`1px solid #d4a93a`,borderRadius:99,padding:"2px 8px",fontSize:12,color:C.charcoal,fontWeight:500}}>
          {name}
          <span onClick={()=>remove(name)}
            style={{cursor:"pointer",color:C.yellowDark,fontSize:15,lineHeight:1,fontWeight:700}}>×</span>
        </span>
      ))}
      <input value={input} onChange={e=>setInput(e.target.value)}
        onKeyDown={e=>{
          if(e.key==="Enter"){e.preventDefault();add();}
          if(e.key==="Backspace"&&!input&&value.length)onChange(value.slice(0,-1));
        }}
        placeholder={value.length?"":"Name eingeben + Enter …"}
        style={{border:"none",outline:"none",background:"transparent",fontSize:13,
          color:C.charcoal,fontFamily:"inherit",minWidth:160,flex:1,padding:"2px 0"}}/>
    </div>
  );
}

// ── NEW: EventsRow – yellow bars pinned above day cells ───────
function EventsRow({weekCells, events, onEventClick, compact}) {
  const bars = getEventBars(events, weekCells);
  // Always render a small spacer row; only show bars when events exist
  if (bars.length === 0) return <div style={{height: compact ? 4 : 6, marginBottom: compact ? 4 : 6}}/>;
  return (
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",
      gap:compact?3:6,marginBottom:compact?4:8,gridAutoRows:"auto"}}>
      {bars.map(({event,colStart,colEnd})=>(
        <div key={event.id} onClick={()=>onEventClick(event)}
          style={{gridColumnStart:colStart,gridColumnEnd:colEnd,
            background:C.yellow,color:C.charcoal,
            borderRadius:6,padding:compact?"2px 7px":"5px 11px",
            fontSize:compact?10:12,fontWeight:700,cursor:"pointer",
            whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",
            border:"1px solid #d4a93a",boxShadow:"0 1px 4px rgba(0,0,0,0.10)",
            display:"flex",alignItems:"center",gap:4}}>
          <span style={{flexShrink:0}}>{EVENT_ICONS[event.type]||"📅"}</span>
          <span style={{overflow:"hidden",textOverflow:"ellipsis"}}>{event.name}</span>
        </div>
      ))}
    </div>
  );
}

              <button onClick={()=>remove(m)} disabled={members.length<=1}
                style={{background:C.yellowLight,border:`1px solid ${C.yellow}`,color:"#9a6c00",
                  borderRadius:6,padding:"3px 10px",fontSize:12,fontWeight:600,fontFamily:"inherit",
                  cursor:members.length<=1?"not-allowed":"pointer",opacity:members.length<=1?0.4:1}}>
                Entfernen
              </button>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:8,marginBottom:22}}>
          <input value={newName} onChange={e=>setNewName(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Neues Mitglied…" style={{...inp,flex:1}}/>
          <button onClick={add} style={{padding:"9px 16px",background:C.aqua,color:C.white,border:"none",
            borderRadius:8,fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
            + Hinzufügen
          </button>
        </div>
        <button onClick={()=>onSave(members)} style={{width:"100%",padding:"10px",background:C.aqua,
          color:C.white,border:"none",borderRadius:8,fontWeight:700,fontSize:14,
          cursor:"pointer",fontFamily:"inherit"}}>Speichern</button>
      </div>
    </div>
  );
}

function Modal({post,onSave,onDelete,onClose,team,saving}){
  const isNew=!post.id;
  const initPersons=Array.isArray(post.persons)?post.persons:(post.person?[post.person]:[team[0]]);
  const [f,setF]=useState({
    id:post.id||null,topic:post.topic||"",date:post.date||fmtISO(new Date()),
    platform:post.platform||"LinkedIn",persons:initPersons,
    statusPost:post.statusPost||"Geplant",statusCopy:post.statusCopy||"In Arbeit",statusVisual:post.statusVisual||"Gebrieft",
  });
  const [confirmDel,setConfirmDel]=useState(false);
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(128,2,57,0.35)",
      display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(3px)"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.naturalWhite,borderRadius:16,
        padding:"28px 30px",width:450,maxWidth:"94vw",boxShadow:"0 24px 60px rgba(128,2,57,0.2)",
        maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
          <h2 style={{margin:0,fontSize:17,fontWeight:800,color:C.deepPlum}}>
            {isNew?"➕ Neuer Post":"✏️ Post bearbeiten"}
          </h2>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:C.plum4}}>✕</button>
        </div>
        <div style={{marginBottom:14}}>
          <label style={lbl}>Thema *</label>
          <input value={f.topic} onChange={e=>s("topic",e.target.value)} placeholder="z. B. Case Study Launch" style={inp}/>
        </div>
        <div style={{marginBottom:14}}>
          <label style={lbl}>Datum</label>
          <input type="date" value={f.date} onChange={e=>s("date",e.target.value)} style={inp}/>
        </div>
        <div style={{marginBottom:14}}>
          <label style={lbl}>Plattform</label>
          <select value={f.platform} onChange={e=>s("platform",e.target.value)} style={inp}>
            {PLATFORMS.map(o=><option key={o}>{o}</option>)}
          </select>
        </div>
        <div style={{marginBottom:14}}>
          <label style={lbl}>Verantwortlich</label>
          <PersonSelector team={team} value={f.persons} onChange={v=>s("persons",v)}/>
        </div>
        {[
          {l:"Status Post",  k:"statusPost",  opts:STATUS_POST},
          {l:"Status Copy",  k:"statusCopy",  opts:STATUS_COPY},
          {l:"Status Visual",k:"statusVisual",opts:STATUS_VISUAL},
        ].map(({l,k,opts})=>(
          <div key={k} style={{marginBottom:14}}>
            <label style={lbl}>{l}</label>
            <select value={f[k]} onChange={e=>s(k,e.target.value)} style={inp}>
              {opts.map(o=><option key={o}>{o}</option>)}
            </select>
          </div>
        ))}
        <div style={{display:"flex",gap:10,marginTop:22}}>
          <button disabled={saving} onClick={()=>{if(!f.topic.trim()||!f.persons.length)return;onSave({...f,id:f.id||Date.now().toString()});}}
            style={{flex:1,padding:"10px",background:saving?"#999":C.aqua,color:C.white,border:"none",
              borderRadius:8,fontWeight:700,fontSize:14,cursor:saving?"not-allowed":"pointer",fontFamily:"inherit"}}>
            {saving?"Wird gespeichert…":"Speichern"}
          </button>
          {!isNew&&!confirmDel&&(
            <button onClick={()=>setConfirmDel(true)}
              style={{padding:"10px 16px",background:C.yellowLight,color:"#9a6c00",
                border:`1px solid ${C.yellow}`,borderRadius:8,fontWeight:600,
                fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>Löschen</button>
          )}
          {!isNew&&confirmDel&&(
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>onDelete(post.id)} style={{padding:"10px 14px",background:C.lightPlum,
                color:C.white,border:"none",borderRadius:8,fontWeight:700,fontSize:13,
                cursor:"pointer",fontFamily:"inherit"}}>Ja, löschen</button>
              <button onClick={()=>setConfirmDel(false)} style={{padding:"10px 14px",background:C.plumLight,
                color:C.plum1,border:"none",borderRadius:8,fontWeight:600,fontSize:13,
                cursor:"pointer",fontFamily:"inherit"}}>Abbrechen</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────
function App(){
  const [posts,setPosts]     = useState([]);
  const [events,setEvents]   = useState([]);      // ← NEW
  const [team,setTeam]       = useState(DEFAULT_TEAM);
  const [view,setView]       = useState("week");
  const [mon,setMon]         = useState(getMonday(new Date()));
  const [monthDate,setMonthDate] = useState(new Date());
  const [modal,setModal]     = useState(null);
  const [eventModal,setEventModal] = useState(null); // ← NEW
  const [teamModal,setTeamModal]   = useState(false);
  const [fPerson,setFPerson] = useState("Alle");
  const [fPlat,setFPlat]     = useState("Alle");
  const [loading,setLoading] = useState(true);
  const [saving,setSaving]   = useState(false);
  const [error,setError]     = useState(null);
  const dragId = useRef(null);

  useEffect(()=>{
    (async()=>{
      const {data:pd,error:pe}=await db.from("posts").select("*").order("date");
      if(pe) setError("Posts: "+pe.message); else setPosts((pd||[]).map(fromDb));

      // ── NEW: load events from Supabase ──
      const {data:ed,error:ee}=await db.from("events").select("*").order("date_start");
      if(ee) setError("Events: "+ee.message); else setEvents((ed||[]).map(eventFromDb));

      const {data:td,error:te}=await db.from("team_members").select("name").order("id");
      if(!te&&td&&td.length>0) setTeam(td.map(r=>r.name));

      setLoading(false);
    })();
  },[]);

  // ── Post CRUD (unchanged) ─────────────────────────────────
  const handleSave=async post=>{
    setSaving(true);
    const {error:e}=await db.from("posts").upsert(toDb(post));
    if(e) setError(e.message);
    else { const ex=posts.find(p=>p.id===post.id);setPosts(ex?posts.map(p=>p.id===post.id?post:p):[...posts,post]);setModal(null); }
    setSaving(false);
  };
  const handleDelete=async id=>{
    setSaving(true);
    const {error:e}=await db.from("posts").delete().eq("id",id);
    if(e) setError(e.message); else { setPosts(posts.filter(p=>p.id!==id));setModal(null); }
    setSaving(false);
  };
  const handleDrop=async dateStr=>{
    if(!dragId.current)return;
    const post=posts.find(p=>p.id===dragId.current);if(!post)return;
    const updated={...post,date:dateStr};
    const {error:e}=await db.from("posts").upsert(toDb(updated));
    if(!e) setPosts(posts.map(p=>p.id===updated.id?updated:p));
    dragId.current=null;
  };
  const handleSaveTeam=async newTeam=>{
    setSaving(true);
    await db.from("team_members").delete().not("name","is",null);
    const {error:e}=await db.from("team_members").insert(newTeam.map(name=>({name})));
    if(e) setError(e.message); else { setTeam(newTeam);setTeamModal(false); }
    setSaving(false);
  };

  // ── NEW: Event CRUD ───────────────────────────────────────
  const handleSaveEvent=async event=>{
    setSaving(true);
    const {error:e}=await db.from("events").upsert(eventToDb(event));
    if(e) setError(e.message);
    else {
      const ex=events.find(ev=>ev.id===event.id);
      setEvents(ex?events.map(ev=>ev.id===event.id?event:ev):[...events,event]);
      setEventModal(null);
    }
    setSaving(false);
  };
  const handleDeleteEvent=async id=>{
    setSaving(true);
    const {error:e}=await db.from("events").delete().eq("id",id);
    if(e) setError(e.message); else { setEvents(events.filter(ev=>ev.id!==id));setEventModal(null); }
    setSaving(false);
  };

  const todayStr=fmtISO(new Date());
  const filtered=posts.filter(p=>{
    const persons=Array.isArray(p.persons)?p.persons:(p.person?[p.person]:[]);
    if(fPerson!=="Alle"&&!persons.includes(fPerson))return false;
    if(fPlat!=="Alle"&&p.platform!==fPlat)return false;
    return true;
  });
  const weekDays=getWeekDays(mon);
  const weekLabel=()=>{const end=new Date(mon);end.setDate(end.getDate()+6);
    return `${mon.toLocaleDateString("de-DE",{day:"2-digit",month:"short"})} – ${end.toLocaleDateString("de-DE",{day:"2-digit",month:"short",year:"numeric"})}`;};
  const monthCells=getMonthDays(monthDate.getFullYear(),monthDate.getMonth());
  const monthWeeks=chunkWeeks(monthCells); // ← NEW

  if(loading) return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",
      background:C.naturalWhite,color:C.plum3,fontSize:16}}>Wird geladen…</div>
  );

  return(
    <div style={{fontFamily:"'Inter',system-ui,sans-serif",background:C.naturalWhite,minHeight:"100vh"}}>

      {error&&(
        <div style={{background:"#fef2f2",borderBottom:"1px solid #fca5a5",padding:"10px 20px",
          display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:"#b91c1c"}}>⚠️ {error}</span>
          <button onClick={()=>setError(null)} style={{background:"none",border:"none",cursor:"pointer",color:"#b91c1c"}}>✕</button>
        </div>
      )}

      {/* Header */}
      <div style={{background:C.deepPlum,padding:"0 20px",position:"sticky",top:0,zIndex:50,
        boxShadow:"0 2px 12px rgba(128,2,57,0.3)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
          flexWrap:"wrap",gap:10,padding:"14px 0"}}>
          <div>
            <div style={{fontSize:18,fontWeight:800,color:C.white,letterSpacing:"-0.3px",lineHeight:1}}>We. Social Media Plan</div>
            <div style={{fontSize:11,color:C.plum5,marginTop:3}}>Kommunikations- &amp; PR-Agentur</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <select value={fPerson} onChange={e=>setFPerson(e.target.value)}
              style={{padding:"6px 10px",border:`1px solid ${C.plum2}`,borderRadius:8,fontSize:12,
                color:C.white,background:C.plum1,fontFamily:"inherit",outline:"none",cursor:"pointer"}}>
              <option>Alle</option>
              {team.map(t=><option key={t}>{t}</option>)}
            </select>
            <select value={fPlat} onChange={e=>setFPlat(e.target.value)}
              style={{padding:"6px 10px",border:`1px solid ${C.plum2}`,borderRadius:8,fontSize:12,
                color:C.white,background:C.plum1,fontFamily:"inherit",outline:"none",cursor:"pointer"}}>
              <option>Alle</option>
              {PLATFORMS.map(p=><option key={p}>{p}</option>)}
            </select>
            <button onClick={()=>setTeamModal(true)}
              style={{background:C.plum1,border:`1px solid ${C.plum2}`,borderRadius:8,padding:"6px 11px",
                fontSize:15,cursor:"pointer",color:C.white,fontFamily:"inherit"}}>👥</button>
            <div style={{display:"flex",background:C.plum1,borderRadius:8,padding:3,gap:2}}>
              {[["week","Woche"],["month","Monat"],["list","Liste"]].map(([v,l])=>(
                <button key={v} onClick={()=>setView(v)} style={{padding:"5px 11px",borderRadius:6,border:"none",
                  cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:view===v?700:500,
                  background:view===v?C.white:"transparent",color:view===v?C.deepPlum:C.yellow,
                  boxShadow:view===v?"0 1px 3px rgba(0,0,0,0.12)":"none",transition:"all 0.15s"}}>{l}</button>
              ))}
            </div>
            {/* ── NEW: + Event button ── */}
            <button onClick={()=>setEventModal({})}
              style={{background:"transparent",color:C.yellow,border:`1px solid ${C.yellow}`,
                borderRadius:8,padding:"7px 16px",fontWeight:700,fontSize:13,
                cursor:"pointer",fontFamily:"inherit"}}>+ Event</button>
            <button onClick={()=>setModal({})} style={{background:C.aqua,color:C.white,border:"none",
              borderRadius:8,padding:"7px 16px",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",
              boxShadow:"0 2px 8px rgba(22,125,131,0.35)"}}>+ Neuer Post</button>
          </div>
        </div>
      </div>

      <div style={{padding:"20px",maxWidth:1500,margin:"0 auto"}}>

        {/* ── Week View ── */}
        {view==="week"&&(
          <>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18,flexWrap:"wrap"}}>
              <button onClick={()=>{const d=new Date(mon);d.setDate(d.getDate()-7);setMon(d);}} style={navBtn}>← Vorherige</button>
              <span style={{fontWeight:700,fontSize:14,color:C.deepPlum,minWidth:220,textAlign:"center"}}>{weekLabel()}</span>
              <button onClick={()=>{const d=new Date(mon);d.setDate(d.getDate()+7);setMon(d);}} style={navBtn}>Nächste →</button>
              <button onClick={()=>setMon(getMonday(new Date()))}
                style={{...navBtn,color:C.aquaDark,borderColor:C.aqua,background:C.aquaLight}}>Heute</button>
              <span style={{marginLeft:"auto",fontSize:12,color:C.plum4}}>{filtered.length} Posts</span>
            </div>
            {/* ── NEW: events row pinned above day cells ── */}
            <EventsRow weekCells={weekDays} events={events} onEventClick={setEventModal} compact={false}/>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:10}}>
              {weekDays.map((day,i)=>(
                <DayCell key={i} day={day} isToday={fmtISO(day)===todayStr}
                  posts={filtered.filter(p=>p.date===fmtISO(day))}
                  onClick={setModal} onDragStart={id=>{dragId.current=id;}}
                  onDrop={handleDrop} compact={false} addPost={ds=>setModal({date:ds})}/>
              ))}
            </div>
          </>
        )}

        {/* ── Month View – CHANGED: restructured into week rows so EventsRow can be injected per row ── */}
        {view==="month"&&(
          <>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18,flexWrap:"wrap"}}>
              <button onClick={()=>{const d=new Date(monthDate);d.setMonth(d.getMonth()-1);setMonthDate(d);}} style={navBtn}>← Vorheriger</button>
              <span style={{fontWeight:700,fontSize:14,color:C.deepPlum,minWidth:180,textAlign:"center"}}>
                {MONTHS_DE[monthDate.getMonth()]} {monthDate.getFullYear()}
              </span>
              <button onClick={()=>{const d=new Date(monthDate);d.setMonth(d.getMonth()+1);setMonthDate(d);}} style={navBtn}>Nächster →</button>
              <button onClick={()=>setMonthDate(new Date())}
                style={{...navBtn,color:C.aquaDark,borderColor:C.aqua,background:C.aquaLight}}>Heute</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6,marginBottom:4}}>
              {DAYS_SHORT.map(d=>(
                <div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:C.plum3,
                  textTransform:"uppercase",letterSpacing:"0.05em",padding:"4px 0"}}>{d}</div>
              ))}
            </div>
            {/* ── NEW: per-week rows with EventsRow above each week ── */}
            {monthWeeks.map((week,wi)=>(
              <div key={wi} style={{marginBottom:6}}>
                <EventsRow weekCells={week} events={events} onEventClick={setEventModal} compact={true}/>
                <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6}}>
                  {week.map((day,di)=>day?(
                    <DayCell key={di} day={day} isToday={fmtISO(day)===todayStr}
                      posts={filtered.filter(p=>p.date===fmtISO(day))}
                      onClick={setModal} onDragStart={id=>{dragId.current=id;}}
                      onDrop={handleDrop} compact={true} addPost={ds=>setModal({date:ds})}/>
                  ):(
                    <div key={di} style={{minHeight:80,borderRadius:12}}/>
                  ))}
                </div>
              </div>
            ))}
          </>
        )}

        {/* ── List View – CHANGED: Events section added above posts table ── */}
        {view==="list"&&(
          <>
            {/* ── NEW: Events table ── */}
            {events.length>0&&(
              <div style={{background:C.white,borderRadius:12,border:"1px solid #d4a93a",
                overflow:"auto",boxShadow:"0 2px 12px rgba(242,199,90,0.15)",marginBottom:20}}>
                <div style={{background:C.yellow,padding:"10px 16px",borderRadius:"12px 12px 0 0",
                  display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:14,fontWeight:800,color:C.charcoal}}>📅 Events</span>
                  <span style={{fontSize:11,color:"#7a5c00",marginLeft:"auto"}}>{events.length} Events</span>
                </div>
                <table style={{width:"100%",borderCollapse:"collapse",minWidth:600}}>
                  <thead>
                    <tr style={{background:C.yellowLight,borderBottom:"1px solid #d4a93a"}}>
                      {["Von","Bis","Name","Art","Personen",""].map(h=>(
                        <th key={h} style={{padding:"10px 15px",textAlign:"left",fontSize:11,fontWeight:700,
                          color:"#7a5c00",textTransform:"uppercase",letterSpacing:"0.05em",whiteSpace:"nowrap"}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {[...events].sort((a,b)=>a.dateStart.localeCompare(b.dateStart)).map((ev,i)=>(
                      <tr key={ev.id} style={{borderBottom:`1px solid ${C.yellowLight}`,
                        background:i%2===0?C.white:C.yellowLight}}>
                        <td style={td}><span style={{fontWeight:600,color:C.charcoal,fontSize:13}}>{fmtDE(ev.dateStart)}</span></td>
                        <td style={td}><span style={{fontWeight:600,color:C.charcoal,fontSize:13}}>{fmtDE(ev.dateEnd)}</span></td>
                        <td style={td}><span style={{fontWeight:600,color:C.charcoal,fontSize:14}}>{EVENT_ICONS[ev.type]} {ev.name}</span></td>
                        <td style={td}><span style={{fontSize:12,color:C.charcoal}}>{ev.type}</span></td>
                        <td style={td}><span style={{fontSize:12,color:C.charcoal}}>{ev.persons&&ev.persons.length?ev.persons.join(", "):"—"}</span></td>
                        <td style={td}><button onClick={()=>setEventModal(ev)}
                          style={{background:"none",border:"none",cursor:"pointer",fontSize:16,padding:"2px 6px"}}>✏️</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            {/* Existing posts table (unchanged) */}
            <div style={{background:C.white,borderRadius:12,border:"1px solid #e8d8e0",
              overflow:"auto",boxShadow:"0 2px 12px rgba(128,2,57,0.07)"}}>
              <table style={{width:"100%",borderCollapse:"collapse",minWidth:820}}>
                <thead>
                  <tr style={{background:C.deepPlum,borderBottom:`2px solid ${C.lightPlum}`}}>
                    {["Datum","Thema","Plattform","Verantwortlich","Status Post","Status Copy","Status Visual",""].map(h=>(
                      <th key={h} style={{padding:"12px 15px",textAlign:"left",fontSize:11,fontWeight:700,
                        color:C.plum5,textTransform:"uppercase",letterSpacing:"0.05em",whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {[...filtered].sort((a,b)=>a.date.localeCompare(b.date)).map((post,i)=>{
                    const cb=CARD_BG[post.statusPost]||CARD_BG["Geplant"];
                    const rowBg=post.statusPost==="Eingestellt"?C.yellowLight
                      :post.statusPost==="Gepostet"?C.aquaLight
                      :post.statusPost==="Reportet"?"#f5f0f0"
                      :i%2===0?C.white:C.naturalWhite;
                    const persons=Array.isArray(post.persons)?post.persons:(post.person?[post.person]:[]);
                    return(
                      <tr key={post.id} style={{borderBottom:"1px solid #f0e4ea",background:rowBg,opacity:cb.opacity}}>
                        <td style={td}><span style={{fontWeight:600,color:C.plum2,fontSize:13,whiteSpace:"nowrap"}}>{fmtDE(post.date)}</span></td>
                        <td style={td}><span style={{fontWeight:600,color:C.charcoal,fontSize:14}}>{post.topic}</span></td>
                        <td style={td}><Badge label={post.platform} colors={PL[post.platform]||PL["Beide"]}/></td>
                        <td style={td}><span style={{fontSize:12,color:C.charcoal}}>{persons.map(p=>`👤 ${p}`).join(", ")}</span></td>
                        <td style={td}><Badge label={post.statusPost} colors={SP[post.statusPost]||SP["Geplant"]}/></td>
                        <td style={td}><Badge label={post.statusCopy} colors={SC[post.statusCopy]||SC["In Arbeit"]}/></td>
                        <td style={td}><Badge label={post.statusVisual} colors={SV[post.statusVisual]||SV["Gebrieft"]}/></td>
                        <td style={td}><button onClick={()=>setModal(post)}
                          style={{background:"none",border:"none",cursor:"pointer",fontSize:16,padding:"2px 6px"}}>✏️</button></td>
                      </tr>
                    );
                  })}
                  {filtered.length===0&&(
                    <tr><td colSpan={8} style={{padding:48,textAlign:"center",color:C.plum4,fontSize:14}}>
                      Noch keine Posts vorhanden 🚀
                    </td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </>
        )}
      </div>

      {teamModal&&<TeamModal team={team} onSave={handleSaveTeam} onClose={()=>setTeamModal(false)}/>}
      {modal!==null&&<Modal post={modal} onSave={handleSave} onDelete={handleDelete}
        onClose={()=>setModal(null)} team={team} saving={saving}/>}
      {/* ── NEW: EventModal ── */}
      {eventModal!==null&&<EventModal event={eventModal} onSave={handleSaveEvent}
        onDelete={handleDeleteEvent} onClose={()=>setEventModal(null)} saving={saving}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
